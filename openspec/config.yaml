# SDD project config — Sazón: Ruta de las Leyendas
# Generated by sdd-init. Keep `context` concise (<=10 lines); full detail in openspec/project.md.
schema: spec-driven

context: |
  Engine: Unity 6000.3.10f1 (Unity 6), C#, URP 17.3.0, Input System 1.18.0, 2D.
  Game: "Sazón: Ruta de las Leyendas" — cooking/card game jam game.
  Architecture: minimal MonoBehaviours + ScriptableObject data (LevelConfig, RecipeDatabase,
  DeckData, MarketConfig, GameLoopConfig); scene-per-flow (Menu, Map, Market, Legend,
  Tutorial, Credits). 27 scripts under Assets/Scripts/{Camera,Cards,Characters,GameLoop,
  Legend,Map,Market,Menu,Tutorial}.
  Testing: Unity Test Framework 1.6.0 (EditMode/PlayMode) + Unity MCP run_tests.
  No test assemblies exist yet. Style: Unity C# conventions, no linter/formatter configured.

strict_tdd: true

testing:
  strict_tdd: true
  framework: Unity Test Framework
  test_command: "unityMCP run_tests(mode=\"EditMode\") | run_tests(mode=\"PlayMode\")"
  build_command: "Unity -batchmode -quit -executeMethod BuildScript.BuildWindows (CI: .github/workflows/release.yml)"
  detected: "2026-10-15"
  layers:
    unit: true
    integration: false
    e2e: false
  coverage: false
  linter: false
  type_checker: false
  formatter: false
  notes: >
    Unity Test Framework 1.6.0 and com.unity.test-framework.performance 3.2.0 are installed.
    No test assemblies (*.asmdef) exist yet — the first TDD task MUST create
    Assets/Tests/EditMode (and optional PlayMode) with a test asmdef referencing the game
    assembly. Logic is validated via EditMode tests; gameplay feel via PlayMode/screenshots.
    Prefer pure-logic classes (RecipeResolver, RecipeData, GameSession) for fast EditMode tests.

rules:
  proposal:
    - Include rollback plan for risky changes
    - Identify affected modules/packages and scenes/prefabs/ScriptableObjects touched
    - "Respect the jam scope: gameplay value first, no speculative architecture"
  specs:
    - Use Given/When/Then format for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
    - Separate pure game rules (testable) from Unity presentation
  design:
    - Document architecture decisions with rationale
    - Include sequence diagrams for complex flows
    - Prefer one scene, plain MonoBehaviours, direct references (no DI/event-bus)
  tasks:
    - Group tasks by phase (infrastructure, implementation, testing)
    - Use hierarchical numbering (1.1, 1.2, ...)
    - Keep tasks small enough to complete in one session
    - Flag 400-line review budget risk and chained-PR need
  apply:
    - Follow existing code patterns and conventions
    - Load the unity-rapid-prototyping skill for gameplay work
    - Validate Unity MCP prerequisites; read_console after script changes before proceeding
    - Do NOT modify gameplay code outside the change scope
    - Enable RED-GREEN-REFACTOR (tdd=true); run the EditMode test command from the testing block
  verify:
    - Run EditMode tests when test infrastructure exists
    - Compare implementation against every spec scenario
    - Validate gameplay with PlayMode/screenshots; check read_console for errors
    - Use the test command and build command from the testing block; coverage threshold 0
  archive:
    - Warn before merging destructive deltas (large removals)
