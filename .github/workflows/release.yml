name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type for the next release'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
      buildAndroid:
        description: 'Build the Android APK too (default true)'
        required: false
        default: true
        type: boolean
      buildWebGL:
        description: 'Build the WebGL build too (default true)'
        required: false
        default: true
        type: boolean

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  validate:
    name: Validate version & tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.semver.outputs.tag }}
      sha7: ${{ steps.semver.outputs.sha7 }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Guard — release only from main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Release dispatch only allowed from main (got '${GITHUB_REF}'). Aborting before any build."
          exit 1

      - name: Compute next SemVer tag
        id: semver
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          SHA7="${GITHUB_SHA:0:7}"
          LATEST="$(git tag --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1 || true)"
          if [ -z "$LATEST" ]; then
            LATEST="$(git tag --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+[-.]' | head -n1 | sed -E 's/^v([0-9]+\.[0-9]+\.[0-9]+).*$/v\1/' || true)"
          fi
          if [ -z "$LATEST" ]; then
            NEXT="v1.0.0"
          else
            BASE="${LATEST#v}"
            IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE"
            case "$BUMP" in
              patch) NEXT="v${MAJOR}.${MINOR}.$((PATCH + 1))" ;;
              minor) NEXT="v${MAJOR}.$((MINOR + 1)).0" ;;
              major) NEXT="v$((MAJOR + 1)).0.0" ;;
              *) echo "::error::Unknown bump type '${BUMP}'"; exit 1 ;;
            esac
          fi
          echo "Computed next tag: ${NEXT} (sha7=${SHA7})"
          echo "tag=${NEXT}" >> "$GITHUB_OUTPUT"
          echo "sha7=${SHA7}" >> "$GITHUB_OUTPUT"

      - name: Pre-check tag & release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.semver.outputs.tag }}
        run: |
          set -euo pipefail
          OWNER="${GITHUB_REPOSITORY%%/*}"
          REPO="${GITHUB_REPOSITORY#*/}"
          if ! gh api "repos/${OWNER}/${REPO}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} is free — proceeding."
            exit 0
          fi
          echo "::warning::Tag ${TAG} already exists — checking idempotency."
          if gh api "repos/${OWNER}/${REPO}/releases/tags/${TAG}" >/dev/null 2>&1; then
            DRAFT="$(gh api "repos/${OWNER}/${REPO}/releases/tags/${TAG}" --jq '.draft')"
            TARGET="$(gh api "repos/${OWNER}/${REPO}/releases/tags/${TAG}" --jq '.target_commitish')"
            if [ "$DRAFT" = "true" ] && [ "$TARGET" = "$GITHUB_SHA" ]; then
              echo "::warning::Tag ${TAG} has a draft release on this commit — idempotent re-publish."
              exit 0
            fi
            echo "::error::A release for ${TAG} already exists (target=${TARGET}, draft=${DRAFT}). Aborting — pick a different bump or delete the release."
            exit 1
          fi
          TAG_COMMIT="$(git rev-list -n 1 "refs/tags/${TAG}" 2>/dev/null || echo '')"
          if [ "$TAG_COMMIT" = "$GITHUB_SHA" ]; then
            echo "::warning::Tag ${TAG} exists on this commit with no release — proceeding idempotently."
            exit 0
          fi
          echo "::error::Tag ${TAG} already exists on commit ${TAG_COMMIT} (this dispatch targets ${GITHUB_SHA}). Aborting."
          exit 1

  build-windows:
    name: Build Windows
    needs: [validate]
    runs-on: windows-2022
    timeout-minutes: 90
    permissions:
      contents: read
      actions: write
    env:
      TAG: ${{ needs.validate.outputs.tag }}
      SHA7: ${{ needs.validate.outputs.sha7 }}
      UNITY_VERSION: 6000.3.10f1
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true
          # Full history + tags so unity-builder's Semantic versioning derives the exe
          # version from the release tag (without these the built exe reports 0.1.0).
          fetch-depth: 0
          fetch-tags: true

      - name: Create LFS file list
        run: git lfs ls-files -l | cut -d' ' -f1 | sort > .lfs-assets-id

      - name: Restore LFS cache
        uses: actions/cache@v4
        id: lfs-cache
        with:
          path: .git/lfs
          key: ${{ runner.os }}-lfs-${{ hashFiles('.lfs-assets-id') }}

      - name: Git LFS Pull
        run: git lfs pull

      - name: Clean LFS pull side effects
        run: |
          git add .
          git reset --hard

      # CI-only: remove Unity AI Assistant packages (com.unity.ai.assistant + com.unity.ai.inference)
      # from the manifest. They are Editor-side packages that spawn a relay in the container and
      # crash Unity during package import in CI (exit 255). They are NOT needed for headless builds
      # and are independent of com.coplaydev.unity-mcp (the MCP bridge used locally). This edit
      # happens only on the runner — the local project manifest is untouched.
      - name: Remove AI Assistant packages (CI only)
        shell: pwsh
        run: |
          $manifest = Get-Content "Packages/manifest.json" -Raw
          $json = $manifest | ConvertFrom-Json
          $json.dependencies.PSObject.Properties.Remove("com.unity.ai.assistant")
          $json.dependencies.PSObject.Properties.Remove("com.unity.ai.inference")
          $json | ConvertTo-Json -Depth 10 | Set-Content "Packages/manifest.json" -Encoding utf8
          Write-Host "AI Assistant removed from CI manifest"
          # The manifest edit dirties the tree; unity-builder refuses dirty branches. The lock
          # file will be regenerated by Unity during the build (it also gets committed by this
          # commit so the tree stays clean for semantic versioning).
          git add Packages/manifest.json Packages/packages-lock.json
          git -c user.name="CI" -c user.email="ci@github.com" commit -m "ci: remove AI assistant for build" --allow-empty || true
          git status --porcelain

      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-StandaloneWindows64-${{ hashFiles('.lfs-assets-id', 'Packages/packages-lock.json') }}-${{ github.run_id }}
          restore-keys: |
            Library-StandaloneWindows64-
            Library-

      # IL2CPP crash fallback chain — execute IN ORDER only after an AS-IS re-run with the
      # diagnostics step below captures the REAL error (do NOT preempt; diagnostics first):
      #   1. Re-run AS-IS (pin v4.8.2 + diagnostics) — mandatory first step.
      #   2. customImage: unityci/editor:windows-6000.3.10f1-windows-il2cpp-2 (same editor,
      #      older image revision — NOT a downgrade; verify tag exists on hub.docker.com/r/unityci/editor).
      #   3. If `-2` absent/fails: newest windows-6000.3.10f1-windows-il2cpp-* revision other than `-3`.
      #   4. If no 6000.3.10f1 il2cpp image works: STOP — editor downgrade requires user approval.
      #   5. Last resort DIAGNOSTIC-ONLY: -windows-mono-3 image to isolate IL2CPP-toolchain vs
      #      project-content; produces a Mono exe — revert to IL2CPP immediately after.
      # IL2CPP stays permanent. v4.8.2 auto-mounts VS + Windows SDK on windows-2022 by default.
      - name: Build Windows
        uses: game-ci/unity-builder@v4.8.2
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: StandaloneWindows64
          buildName: Sazon-Ruta-de-Las-Leyendas-Windows
          buildsPath: build
          # IL2CPP container fix: the `-3` image for 6000.3.10f1 crashes natively (exit 255,
          # broken container user profile — CreateDirectory Caches failed). Revision 3.2.x is
          # newer and includes the container fixes (verified present on Docker Hub 2026-09-21).
          customImage: unityci/editor:windows-6000.3.10f1-windows-il2cpp-3.2.2

      # Known crash signature so far: exit 255, EMPTY build output, and a suppressed
      # "CreateDirectory '.../Unity/Caches' failed" user-profile error (hidden by
      # `-logfile -` + `-silent-crashes`). Upload Unity logs + crash dumps on failure.
      - name: Upload build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics-${{ github.run_id }}
          path: |
            Library/Logs/
            Logs/
            build/
          retention-days: 1
          if-no-files-found: warn

      - name: Strip DoNotShip folders
        shell: pwsh
        run: |
          Get-ChildItem "build/StandaloneWindows64" -Directory | Where-Object { $_.Name -like "*DoNotShip*" -or $_.Name -like "*BackUpThisFolder*" } | ForEach-Object { Write-Host "Removing $($_.FullName)"; Remove-Item $_.FullName -Recurse -Force }
          Get-ChildItem "build/StandaloneWindows64" -Recurse -Directory | Where-Object { $_.Name -like "*DoNotShip*" } | ForEach-Object { Remove-Item $_.FullName -Recurse -Force -ErrorAction SilentlyContinue }

      - name: Package Windows
        shell: pwsh
        run: |
          $asset = "Sazon-Ruta-de-Las-Leyendas-Windows-${env:TAG}-${env:SHA7}.zip"
          Compress-Archive -Path "build/StandaloneWindows64/*" -DestinationPath $asset -Force
          Get-ChildItem $asset | Format-List Length,Name

      - uses: actions/upload-artifact@v4
        with:
          name: Sazon-Ruta-de-Las-Leyendas-Windows-${{ needs.validate.outputs.sha7 }}
          path: Sazon-Ruta-de-Las-Leyendas-Windows-*.zip
          retention-days: 1
          if-no-files-found: error

  build-android:
    name: Build Android
    if: inputs.buildAndroid
    needs: [validate]
    # Android builds run on ubuntu (per game-ci docs: Linux-based platforms incl. Android).
    # The Linux images are also the stable ones — they avoid the Windows-container issues.
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      actions: write
    env:
      TAG: ${{ needs.validate.outputs.tag }}
      SHA7: ${{ needs.validate.outputs.sha7 }}
      UNITY_VERSION: 6000.3.10f1
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0
          fetch-tags: true

      - name: Create LFS file list
        run: git lfs ls-files -l | cut -d' ' -f1 | sort > .lfs-assets-id

      - name: Restore LFS cache
        uses: actions/cache@v4
        id: lfs-cache
        with:
          path: .git/lfs
          key: ${{ runner.os }}-lfs-${{ hashFiles('.lfs-assets-id') }}

      - name: Git LFS Pull
        run: git lfs pull

      - name: Clean LFS pull side effects
        run: |
          git add .
          git reset --hard

      # CI-only: remove Unity AI Assistant packages (see build-windows for rationale).
      # Uses python3 (available on ubuntu) to edit the JSON manifest.
      - name: Remove AI Assistant packages (CI only)
        shell: bash
        run: |
          python3 - <<'EOF'
          import json
          p = "Packages/manifest.json"
          with open(p) as f:
              data = json.load(f)
          data["dependencies"].pop("com.unity.ai.assistant", None)
          data["dependencies"].pop("com.unity.ai.inference", None)
          with open(p, "w") as f:
              json.dump(data, f, indent=2)
          print("AI Assistant removed from CI manifest")
          EOF
          git add Packages/manifest.json Packages/packages-lock.json
          git -c user.name="CI" -c user.email="ci@github.com" commit -m "ci: remove AI assistant for build" --allow-empty || true
          git status --porcelain

      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-Android-${{ hashFiles('.lfs-assets-id', 'Packages/packages-lock.json') }}-${{ github.run_id }}
          restore-keys: |
            Library-Android-
            Library-

      - name: Build Android
        uses: game-ci/unity-builder@v4.8.2
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: Android
          buildName: Sazon-Ruta-de-Las-Leyendas-Android
          buildsPath: build
          # Debug-signed APK (no release keystore yet). Add the ANDROID_KEYSTORE_* secrets
          # and the androidKeystore* options below when publishing to the Play Store.
          androidExportType: androidPackage
          # The LINUX android image (ubuntu runner) — NOT the Windows one.
          customImage: unityci/editor:ubuntu-6000.3.10f1-android-3.2.2

      - name: Upload build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-diagnostics-${{ github.run_id }}
          path: |
            Library/Logs/
            Logs/
            build/
          retention-days: 1
          if-no-files-found: warn

      - name: Package Android
        shell: bash
        run: |
          asset="Sazon-Ruta-de-Las-Leyendas-Android-${TAG}-${SHA7}.zip"
          (cd build/Android && zip -qr ../../"${asset}" .)
          ls -lh "${asset}"

      - uses: actions/upload-artifact@v4
        with:
          name: Sazon-Ruta-de-Las-Leyendas-Android-${{ needs.validate.outputs.sha7 }}
          path: Sazon-Ruta-de-Las-Leyendas-Android-*.zip
          retention-days: 1
          if-no-files-found: error

  build-webgl:
    name: Build WebGL
    if: inputs.buildWebGL
    needs: [validate]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      actions: write
    env:
      TAG: ${{ needs.validate.outputs.tag }}
      SHA7: ${{ needs.validate.outputs.sha7 }}
      UNITY_VERSION: 6000.3.10f1
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0
          fetch-tags: true

      - name: Create LFS file list
        run: git lfs ls-files -l | cut -d' ' -f1 | sort > .lfs-assets-id

      - name: Restore LFS cache
        uses: actions/cache@v4
        id: lfs-cache
        with:
          path: .git/lfs
          key: ${{ runner.os }}-lfs-${{ hashFiles('.lfs-assets-id') }}

      - name: Git LFS Pull
        run: git lfs pull

      - name: Clean LFS pull side effects
        run: |
          git add .
          git reset --hard

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/powershell
          df -h

      # CI-only: remove Unity AI Assistant packages (see build-windows for rationale).
      - name: Remove AI Assistant packages (CI only)
        shell: bash
        run: |
          python3 - <<'EOF'
          import json
          p = "Packages/manifest.json"
          with open(p) as f:
              data = json.load(f)
          data["dependencies"].pop("com.unity.ai.assistant", None)
          data["dependencies"].pop("com.unity.ai.inference", None)
          with open(p, "w") as f:
              json.dump(data, f, indent=2)
          print("AI Assistant removed from CI manifest")
          EOF
          git add Packages/manifest.json Packages/packages-lock.json
          git -c user.name="CI" -c user.email="ci@github.com" commit -m "ci: remove AI assistant for build" --allow-empty || true
          git status --porcelain

      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-WebGL-${{ hashFiles('.lfs-assets-id', 'Packages/packages-lock.json') }}-${{ github.run_id }}
          restore-keys: |
            Library-WebGL-
            Library-

      - name: Build WebGL
        uses: game-ci/unity-builder@v4.8.2
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: WebGL
          buildName: Sazon-Ruta-de-Las-Leyendas-WebGL
          buildsPath: build
          # Same revision convention as the Android job. If this exact webgl image
          # revision does not exist on Docker Hub, drop customImage (default image).
          customImage: unityci/editor:ubuntu-6000.3.10f1-webgl-3.2.2

      - name: Upload build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: webgl-build-diagnostics-${{ github.run_id }}
          path: |
            Library/Logs/
            Logs/
            build/
          retention-days: 1
          if-no-files-found: warn

      - name: Strip DoNotShip folders
        shell: bash
        run: |
          find build/WebGL -type d \( -name "*DoNotShip*" -o -name "*BackUpThisFolder*" \) -prune -exec rm -rf {} + || true

      - name: Package WebGL
        shell: bash
        run: |
          asset="Sazon-Ruta-de-Las-Leyendas-WebGL-${TAG}-${SHA7}.zip"
          (cd build/WebGL && zip -qr ../../"${asset}" .)
          ls -lh "${asset}"

      - uses: actions/upload-artifact@v4
        with:
          name: Sazon-Ruta-de-Las-Leyendas-WebGL-${{ needs.validate.outputs.sha7 }}
          path: Sazon-Ruta-de-Las-Leyendas-WebGL-*.zip
          retention-days: 1
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [build-windows, build-android, build-webgl, validate]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4

      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: Sazon-Ruta-de-Las-Leyendas-*
          merge-multiple: true

      - name: Verify release assets present
        run: |
          set -euo pipefail
          ls -lh release-assets/
          if [ -z "$(find release-assets -maxdepth 1 -name "Sazon-Ruta-de-Las-Leyendas-Windows-*.zip" -print -quit)" ]; then
            echo "::error::Missing release asset for Windows — refusing to publish."
            exit 1
          fi
          if [ "${{ inputs.buildAndroid }}" = "true" ] && [ -z "$(find release-assets -maxdepth 1 -name "Sazon-Ruta-de-Las-Leyendas-Android-*.zip" -print -quit)" ]; then
            echo "::error::Missing release asset for Android — refusing to publish."
            exit 1
          fi
          if [ "${{ inputs.buildWebGL }}" = "true" ] && [ -z "$(find release-assets -maxdepth 1 -name "Sazon-Ruta-de-Las-Leyendas-WebGL-*.zip" -print -quit)" ]; then
            echo "::error::Missing release asset for WebGL — refusing to publish."
            exit 1
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.validate.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: 'Sazón: Ruta de las Leyendas ${{ needs.validate.outputs.tag }}'
          generate_release_notes: true
          overwrite_files: true
          fail_on_unmatched_files: true
          files: |
            release-assets/Sazon-Ruta-de-Las-Leyendas-*.zip

  deploy-itch:
    name: Deploy to Itch.io
    needs: [publish, validate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    env:
      TAG: ${{ needs.validate.outputs.tag }}
      SHA7: ${{ needs.validate.outputs.sha7 }}
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: Sazon-Ruta-de-Las-Leyendas-*
          merge-multiple: true

      - name: Unpack for Butler
        run: |
          set -euo pipefail
          mkdir -p itch/Windows itch/Android
          unzip -q "release-assets/Sazon-Ruta-de-Las-Leyendas-Windows-${TAG}-${SHA7}.zip" -d itch/Windows
          unzip -q "release-assets/Sazon-Ruta-de-Las-Leyendas-Android-${TAG}-${SHA7}.zip" -d itch/Android
          ls -R itch | head -n 100 || true

      - name: Deploy Windows (itch)
        uses: yeslayla/butler-publish-itchio-action@master
        env:
          BUTLER_CREDENTIALS: ${{ secrets.BUTLER_CREDENTIALS }}
          CHANNEL: windows
          ITCH_GAME: maid-cafe-combo-manager
          ITCH_USER: PeryLoth
          PACKAGE: itch/Windows

      - name: Deploy Android (itch)
        uses: yeslayla/butler-publish-itchio-action@master
        env:
          BUTLER_CREDENTIALS: ${{ secrets.BUTLER_CREDENTIALS }}
          CHANNEL: android
          ITCH_GAME: maid-cafe-combo-manager
          ITCH_USER: PeryLoth
          PACKAGE: itch/Android

      - name: Deploy WebGL (itch)
        uses: yeslayla/butler-publish-itchio-action@master
        env:
          BUTLER_CREDENTIALS: ${{ secrets.BUTLER_CREDENTIALS }}
          CHANNEL: webgl
          ITCH_GAME: maid-cafe-combo-manager
          ITCH_USER: PeryLoth
          PACKAGE: release-assets/Sazon-Ruta-de-Las-Leyendas-WebGL-${{ env.TAG }}-${{ env.SHA7 }}.zip